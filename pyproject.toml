[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poemcard"
version = "0.1.1"
authors = [
  { name="Group66" }
]
description = "Poem card generator"
requires-python = ">=3.9"
dependencies = [
  "Pillow>=9.0"
]
readme = "README.md"
[project.urls]
Homepage = "https://github.com/wenyuchen66/66"
Repository = "https://github.com/wenyuchen66/66"
[tool.setuptools]
packages = ["poemcard"]
package-dir = { "poemcard" = "src/poemcard" }
